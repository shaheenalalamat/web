<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>شات خفيف ⚡</title>
<style>
:root{--bg0:#1e1f22;--bg1:#2b2d31;--bg2:#313338;--bg3:#383a40;--bg4:#4e5058;--accent:#5865f2;--green:#23a559;--red:#f23f43;--yellow:#f0b232;--text:#f2f3f5;--muted:#949ba4}
[data-theme=midnight]{--bg0:#000;--bg1:#0a0a0d;--bg2:#101014;--bg3:#1b1b21;--bg4:#2a2a33}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;scrollbar-width:thin;scrollbar-color:var(--bg4) transparent}
html,body{height:100%}
body{background:var(--bg0);color:var(--text);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input{font:inherit;color:var(--text);outline:none}
svg.ic{width:20px;height:20px;fill:currentColor;flex:none}
.app{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100vh;height:100dvh}
.nav{display:flex;min-height:0}

/* شريط الرومات */
.rail{width:72px;background:var(--bg0);display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0;overflow-y:auto;scrollbar-width:none}
.rbtn{width:48px;height:48px;border-radius:50%;background:var(--c,var(--bg2));color:#fff;font-weight:700;font-size:17px;position:relative;flex:none;display:grid;place-items:center;transition:border-radius .2s,background .2s,transform .15s}
.rbtn:hover,.rbtn.on{border-radius:16px;background:var(--accent)}
.rbtn:active{transform:scale(.93)}
.rbtn.on::before{content:"";position:absolute;inset-inline-start:-12px;top:50%;width:4px;height:36px;border-radius:4px;background:#fff;transform:translateY(-50%)}
.rbtn.logo{background:linear-gradient(135deg,var(--accent),#eb459e);border-radius:16px;cursor:default}
.rbtn.add{background:var(--bg2);color:var(--green);font-size:24px}
.rbtn.add:hover{background:var(--green);color:#fff}
.rsep{width:32px;height:2px;border-radius:2px;background:var(--bg3);flex:none}

/* الشريط الجانبي */
.side{width:252px;background:var(--bg1);display:flex;flex-direction:column;min-height:0;border-start-start-radius:12px}
.shead{padding:14px 16px;font-weight:700;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--bg0);box-shadow:0 1px 0 rgba(0,0,0,.2);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 24%,transparent),transparent 70%)}
.shead b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{background:var(--bg3);border-radius:6px;padding:5px 10px;font-size:12px;font-weight:600;transition:background .15s}
.chip:hover{background:var(--accent);color:#fff}
.sec{padding:10px 12px;display:flex;gap:6px}
.sec input{flex:1;min-width:0;background:var(--bg0);border:1px solid transparent;border-radius:8px;padding:8px 10px;font-size:13px;transition:border-color .15s}
.sec input:focus{border-color:var(--accent)}
.btn{background:var(--accent);color:#fff;border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:scale(.96)}
.label{font-size:11px;font-weight:700;color:var(--muted);padding:10px 16px 4px}
#members{list-style:none;flex:1;overflow-y:auto;padding:0 8px}
.member{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;transition:background .15s}
.member:hover{background:var(--bg3)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.info{flex:1;min-width:0;display:flex;flex-direction:column}
.nm{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info small{font-size:11px;color:var(--muted)}
.member.speaking .avatar,.avatar.ring{animation:ring 1.1s ease-out infinite}
.member.speaking .nm{color:#4ade80}
@keyframes ring{0%{box-shadow:0 0 0 2px var(--gap,var(--bg1)),0 0 0 4px var(--green),0 0 0 4px rgba(35,165,89,.7)}100%{box-shadow:0 0 0 2px var(--gap,var(--bg1)),0 0 0 4px var(--green),0 0 0 11px rgba(35,165,89,0)}}

/* لوحة المستخدم */
.upanel{--gap:var(--bg0);display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--bg0);position:relative}
.upanel .me{flex:1;min-width:0;display:flex;flex-direction:column;margin-inline-start:4px}
.upanel input{background:none;border:none;font-size:13px;font-weight:600;width:100%}
.upanel small{font-size:11px;color:var(--muted)}
.ibtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;color:var(--muted);flex:none;transition:background .15s,color .15s}
.ibtn:hover{background:var(--bg3);color:var(--text)}
.ibtn.active{color:var(--text)}
.ibtn.danger{color:var(--red)}
.ibtn.danger::after{content:"";position:absolute;width:2px;height:22px;background:currentColor;border-radius:2px;transform:rotate(45deg);box-shadow:0 0 0 1.5px var(--bg0)}
.ibtn .lbl{display:none}

/* النوافذ المنبثقة */
.pop{display:none;position:absolute;z-index:30;background:var(--bg0);border:1px solid var(--bg3);border-radius:12px;padding:12px;box-shadow:0 8px 28px rgba(0,0,0,.5)}
.pop.open{display:block;animation:pop .15s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.97)}}
#settingsPop{bottom:calc(100% + 6px);inset-inline-start:8px;width:232px}
#emojiPop{bottom:calc(100% + 8px);inset-inline-end:0;width:272px}
.vol{display:flex;align-items:center;gap:8px;color:var(--muted)}
#volumeSlider{flex:1;accent-color:var(--accent);cursor:pointer}
.sw{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:8px 10px;border-radius:8px;background:var(--bg2);font-size:13px;margin-top:8px;text-align:start}
.sw::after{content:"";width:36px;height:20px;border-radius:12px;flex:none;transition:background .2s;background:radial-gradient(circle at 10px 50%,#fff 7px,transparent 8px),var(--bg4)}
.sw.active::after{background:radial-gradient(circle at 26px 50%,#fff 7px,transparent 8px),var(--green)}
.sws{display:flex;gap:8px;margin-top:12px}
.sws i{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s}
.sws i:hover{transform:scale(1.15)}.sws i.on{border-color:#fff}
.eg{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.eg button{font-size:19px;border-radius:6px;padding:4px 0;transition:background .1s,transform .1s}
.eg button:hover{background:var(--bg3);transform:scale(1.2)}

/* المنطقة الرئيسية */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg2);background:radial-gradient(900px 420px at 100% 0,color-mix(in srgb,var(--accent) 14%,transparent),transparent),var(--bg2)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--bg0);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.top h2{font-size:15px;flex:1 1 80px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top h2 .h{color:var(--muted);margin-inline-end:4px}
#menuBtn{display:none}
.badge{font-size:12px;padding:4px 10px;border-radius:20px;background:var(--bg0);color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:color .2s}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.badge.online,.badge.good{color:#4ade80}.badge.wait,.badge.mid{color:var(--yellow)}.badge.bad{color:#f87171}
.cta,.pill{border-radius:20px;padding:7px 14px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:filter .15s,transform .1s,background .2s}
.cta{background:var(--accent);color:#fff}
.pill{background:var(--bg3)}
.cta:hover:not(:disabled),.pill:hover{filter:brightness(1.15)}
.cta:active:not(:disabled),.pill:active{transform:scale(.96)}
.cta.active{background:var(--green)}.cta:disabled{opacity:.65;cursor:default}
.pill.active{background:var(--red);color:#fff}

#videoContainer{display:none;position:relative;background:#000;max-height:45vh;justify-content:center;align-items:center;border-bottom:1px solid var(--bg0)}
#videoContainer::before{content:"LIVE";position:absolute;top:10px;inset-inline-start:10px;z-index:1;background:var(--red);color:#fff;font-size:11px;font-weight:800;letter-spacing:.06em;padding:2px 8px;border-radius:4px}
#remoteVideo{width:100%;max-height:45vh;object-fit:contain}
#videoContainer:fullscreen{max-height:none}
#videoContainer:fullscreen #remoteVideo{max-height:100vh;height:100%}
.vctrl{position:absolute;bottom:10px;inset-inline-start:10px;display:flex;gap:6px}
.vctrl button{background:rgba(0,0,0,.65);backdrop-filter:blur(6px);color:#fff;padding:6px 10px;border-radius:8px;font-size:12px}
.vctrl button:hover{background:rgba(0,0,0,.85)}

#chat-box{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:2px}
.msg{display:flex;gap:10px;align-items:flex-start;max-width:90%;margin-top:10px;animation:in .2s ease-out}
.msg.cont{margin-top:0}
.msg.cont .avatar{visibility:hidden;height:0}
.msg.cont .head{display:none}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.bubble{background:var(--bg1);padding:8px 12px;border-radius:14px;min-width:0;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.msg.me .bubble{background:color-mix(in srgb,var(--accent) 35%,var(--bg1))}
.head{display:flex;gap:8px;align-items:baseline;font-size:13px}
.head b{color:var(--c,var(--text))}
.head time{font-size:11px;color:var(--muted)}
.text{font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.sys{font-size:12px;text-align:center;margin:8px 0;animation:in .2s ease-out}
#typing{height:20px;padding:0 22px;font-size:12px;color:var(--muted)}
.input-bar{margin:0 16px 14px;display:flex;align-items:center;gap:4px;background:var(--bg3);border-radius:12px;padding:4px 6px 4px 8px;position:relative}
#msgInput{flex:1;min-width:0;background:none;border:none;padding:10px 12px;font-size:14px}
#sendBtn{background:var(--accent);color:#fff;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;transition:filter .15s,transform .1s}
#sendBtn:hover{filter:brightness(1.12)}#sendBtn:active{transform:scale(.92)}
#sendBtn svg{transform:scaleX(-1)}
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:50;pointer-events:none}
.toast{background:var(--bg0);border:1px solid var(--bg4);border-radius:10px;padding:9px 16px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.45);animation:pop .2s ease-out}

#backdrop{display:none}
@media (max-width:760px){
.app{grid-template-columns:minmax(0,1fr)}
.nav{position:fixed;inset:0 0 0 auto;z-index:20;max-width:94vw;transform:translateX(100%);transition:transform .22s}
.app.open .nav{transform:none}
.app.open #backdrop{display:block;position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.55);backdrop-filter:blur(2px)}
#menuBtn{display:grid}
.side{width:min(252px,70vw)}
.pill .lbl{display:none}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></symbol>
<symbol id="i-head" viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-9 9v7a2 2 0 0 0 2 2h2v-8H5v-1a7 7 0 0 1 14 0v1h-2v8h2a2 2 0 0 0 2-2v-7a9 9 0 0 0-9-9z"/></symbol>
<symbol id="i-tune" viewBox="0 0 24 24"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></symbol>
<symbol id="i-screen" viewBox="0 0 24 24"><path d="M20 3H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h6v2H8v2h8v-2h-2v-2h6a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 12H4V5h16v10z"/></symbol>
<symbol id="i-bolt" viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></symbol>
<symbol id="i-smile" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm-3.5-9a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm7 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM12 17.5a5.5 5.5 0 0 0 4.9-3H7.1a5.5 5.5 0 0 0 4.9 3z"/></symbol>
<symbol id="i-vol" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></symbol>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></symbol>
</svg>

<div class="app" id="app">
    <div class="nav">
        <nav class="rail" id="rail"></nav>
        <aside class="side">
            <div class="shead"><span>#</span><b id="roomName">—</b><button id="copyBtn" class="chip" title="نسخ اسم الروم">نسخ</button></div>
            <div class="sec">
                <input type="text" id="roomInput" placeholder="اسم الروم (مثلاً: 100)" value="squad" />
                <button id="joinRoomBtn" class="btn">دخول</button>
            </div>
            <div class="label">المتواجدون — <span id="roomCount">0</span></div>
            <ul id="members"></ul>
            <div class="upanel">
                <div class="avatar" id="meAvatar">?</div>
                <div class="me"><input type="text" id="usernameInput" placeholder="اكتب اسمك" /><small>اضغط على الاسم لتعديله</small></div>
                <button id="micBtn" class="ibtn danger" title="المايك"><svg class="ic"><use href="#i-mic"/></svg><span class="lbl">المايك: مطفي 🔇</span></button>
                <button id="deafenBtn" class="ibtn" title="السماعة"><svg class="ic"><use href="#i-head"/></svg><span class="lbl">السماعة: شغالة 🎧</span></button>
                <button id="settingsBtn" class="ibtn" title="الإعدادات"><svg class="ic"><use href="#i-tune"/></svg></button>
                <div class="pop" id="settingsPop">
                    <label class="vol"><svg class="ic"><use href="#i-vol"/></svg><input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1" /></label>
                    <button id="nsBtn" class="sw active" title="قارن الصوت مع العزل وبدونه"><span class="lbl">عزل الضوضاء: شغال 🪄</span></button>
                    <button id="themeBtn" class="sw"><span>وضع منتصف الليل 🌙</span></button>
                    <div class="sws" id="sws"></div>
                </div>
            </div>
        </aside>
    </div>
    <div id="backdrop"></div>

    <main class="main">
        <div class="top">
            <button id="menuBtn" class="ibtn" aria-label="القائمة"><svg class="ic"><use href="#i-menu"/></svg></button>
            <h2><span class="h">#</span><span id="topRoom">—</span></h2>
            <span id="ping" class="badge">— ms</span>
            <span id="linkText" class="badge">غير متصل</span>
            <button id="screenBtn" class="pill" title="مشاركة الشاشة"><svg class="ic"><use href="#i-screen"/></svg><span class="lbl">الشاشة: مطفي 🖥️</span></button>
            <button id="startBtn" class="cta"><svg class="ic"><use href="#i-bolt"/></svg><span class="lbl">اتصال P2P ⚡</span></button>
        </div>
        <div id="videoContainer">
            <video id="remoteVideo" autoplay playsinline></video>
            <div class="vctrl">
                <button id="streamAudioBtn" hidden>🔊 صوت البث</button>
                <button id="fullscreenBtn">تكبير الشاشة ⛶</button>
            </div>
        </div>
        <div id="chat-box"></div>
        <div id="typing"></div>
        <div class="input-bar">
            <input type="text" id="msgInput" placeholder="اكتب رسالة لصاحبك..." autocomplete="off" />
            <button id="emojiBtn" class="ibtn" title="إيموجي"><svg class="ic"><use href="#i-smile"/></svg></button>
            <button id="sendBtn" title="إرسال"><svg class="ic"><use href="#i-send"/></svg></button>
            <div class="pop" id="emojiPop"><div class="eg" id="eg"></div></div>
        </div>
    </main>
</div>
<div id="toasts"></div>
<audio id="remoteAudio" autoplay></audio>
<script type="module" src="main.js"></script>
</body>
</html>
