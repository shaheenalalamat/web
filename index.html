<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>شات خفيف ⚡</title>
    <style>
        :root {
            --bg0: #1e1f22; --bg1: #2b2d31; --bg2: #313338; --bg3: #383a40;
            --accent: #5865f2; --accent2: #4752c4; --green: #23a559; --red: #da373c;
            --yellow: #f0b232; --text: #f2f3f5; --muted: #949ba4;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
        html, body { height: 100%; }
        body { background: var(--bg0); color: var(--text); overflow: hidden; }
        button { font: inherit; color: inherit; cursor: pointer; border: none; }
        input { font: inherit; color: var(--text); outline: none; }
        .app { display: grid; grid-template-columns: 260px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); height: 100vh; height: 100dvh; }

        /* الشريط الجانبي */
        .side { background: var(--bg1); display: flex; flex-direction: column; min-height: 0; border-inline-end: 1px solid var(--bg0); }
        .side h1 { font-size: 15px; padding: 14px 16px; border-bottom: 1px solid var(--bg0); }
        .sec { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .room-card { display: flex; align-items: center; gap: 8px; background: var(--bg0); border-radius: 8px; padding: 8px 10px; }
        .room-card b { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .field { display: flex; gap: 6px; }
        .field input { flex: 1; min-width: 0; background: var(--bg3); border: 1px solid var(--bg0); border-radius: 6px; padding: 7px 9px; font-size: 13px; }
        .field input:focus { border-color: var(--accent); }
        .btn { background: var(--accent); color: #fff; border-radius: 6px; padding: 7px 12px; font-weight: 600; font-size: 13px; }
        .btn:hover { background: var(--accent2); }
        .label { font-size: 12px; color: var(--muted); padding: 6px 16px; }
        #members { list-style: none; flex: 1; overflow-y: auto; padding: 0 8px; }
        .member { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 6px; }
        .member:hover { background: var(--bg3); }
        .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; font-weight: 700; flex: none; transition: box-shadow .15s; }
        .info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        .nm { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .info small { font-size: 11px; color: var(--muted); }
        .member.speaking .avatar { box-shadow: 0 0 0 2px var(--bg1), 0 0 0 4px var(--green), 0 0 12px 2px var(--green); }
        .member.speaking .nm { color: #4ade80; }

        /* المنطقة الرئيسية */
        .main { display: flex; flex-direction: column; background: var(--bg2); min-width: 0; min-height: 0; }
        .top { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--bg0); }
        .top h2 { font-size: 15px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #menuBtn { display: none; background: none; font-size: 20px; }
        .badge { font-size: 12px; padding: 3px 10px; border-radius: 20px; background: #3f4147; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
        .badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
        .badge.online, .badge.good { color: #4ade80; }
        .badge.wait, .badge.mid { color: var(--yellow); }
        .badge.bad { color: #f87171; }

        #videoContainer { display: none; position: relative; background: #000; max-height: 45vh; justify-content: center; align-items: center; border-bottom: 1px solid var(--bg0); }
        #remoteVideo { width: 100%; max-height: 45vh; object-fit: contain; }
        #videoContainer:fullscreen { max-height: none; }
        #videoContainer:fullscreen #remoteVideo { max-height: 100vh; height: 100%; }
        .vctrl { position: absolute; bottom: 10px; inset-inline-start: 10px; display: flex; gap: 6px; }
        .vctrl button { background: rgba(0, 0, 0, .7); color: #fff; border: 1px solid #555; padding: 5px 10px; border-radius: 6px; font-size: 12px; }

        #chat-box { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
        .msg { display: flex; gap: 10px; align-items: flex-start; max-width: 90%; }
        .msg .avatar { background: #4e5058; }
        .msg.me .avatar { background: var(--accent); }
        .bubble { background: var(--bg1); padding: 8px 12px; border-radius: 12px; min-width: 0; }
        .msg.me .bubble { background: #3c4270; }
        .head { display: flex; gap: 8px; align-items: baseline; font-size: 13px; }
        .head time { font-size: 11px; color: var(--muted); }
        .text { font-size: 14px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
        .sys { font-size: 12px; text-align: center; }

        .input-bar { padding: 10px 14px; display: flex; gap: 8px; }
        #msgInput { flex: 1; min-width: 0; background: var(--bg3); border: none; border-radius: 8px; padding: 10px 14px; font-size: 14px; }
        #sendBtn { background: var(--accent); color: #fff; border-radius: 8px; padding: 0 18px; font-weight: 700; }

        .dock { background: var(--bg1); padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid var(--bg0); }
        .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .ctrl-btn { background: var(--bg3); padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; }
        .ctrl-btn:hover { background: #474a52; }
        .ctrl-btn.active { background: var(--green); color: #fff; }
        .ctrl-btn.danger { background: var(--red); color: #fff; }
        .ctrl-btn:disabled { opacity: .45; cursor: not-allowed; }
        .vol { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
        #volumeSlider { width: 90px; accent-color: var(--accent); cursor: pointer; }

        /* الموبايل: الشريط الجانبي يصير قائمة منزلقة */
        #backdrop { display: none; }
        @media (max-width: 720px) {
            .app { grid-template-columns: minmax(0, 1fr); }
            .side { position: fixed; inset: 0 0 0 auto; width: 80%; max-width: 300px; z-index: 20; transform: translateX(100%); transition: transform .2s; }
            .app.open .side { transform: none; }
            .app.open #backdrop { display: block; position: fixed; inset: 0; background: rgba(0, 0, 0, .5); z-index: 10; }
            #menuBtn { display: block; }
        }
    </style>
</head>
<body>
    <div class="app" id="app">
        <aside class="side">
            <h1>شات خفيف ⚡</h1>
            <div class="sec">
                <div class="room-card"><span>#</span><b id="roomName">—</b><button id="copyBtn" class="btn" title="نسخ اسم الروم">نسخ</button></div>
                <div class="field">
                    <input type="text" id="roomInput" placeholder="اسم الروم (مثلاً: 100)" value="squad" />
                    <button id="joinRoomBtn" class="btn">دخول</button>
                </div>
                <div class="field"><input type="text" id="usernameInput" placeholder="اسمك (مثلاً: شاهين)" /></div>
            </div>
            <div class="label">المتواجدون — <span id="roomCount">0</span></div>
            <ul id="members"></ul>
        </aside>
        <div id="backdrop"></div>

        <main class="main">
            <div class="top">
                <button id="menuBtn" aria-label="القائمة">☰</button>
                <h2># <span id="topRoom">—</span></h2>
                <span id="linkText" class="badge">غير متصل</span>
                <span id="ping" class="badge">— ms</span>
            </div>
            <div id="videoContainer">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="vctrl">
                    <button id="streamAudioBtn" hidden>🔊 صوت البث</button>
                    <button id="fullscreenBtn">تكبير الشاشة ⛶</button>
                </div>
            </div>
            <div id="chat-box"></div>
            <div class="input-bar">
                <input type="text" id="msgInput" placeholder="اكتب رسالة لصاحبك..." />
                <button id="sendBtn">إرسال</button>
            </div>
            <div class="dock">
                <div class="controls">
                    <button id="startBtn" class="ctrl-btn">اتصال P2P ⚡</button>
                    <button id="micBtn" class="ctrl-btn">المايك: مطفي 🔇</button>
                    <button id="deafenBtn" class="ctrl-btn">السماعة: شغالة 🎧</button>
                    <button id="nsBtn" class="ctrl-btn active" title="قارن الصوت مع العزل وبدونه">عزل الضوضاء: شغال 🪄</button>
                    <button id="screenBtn" class="ctrl-btn">الشاشة: مطفي 🖥️</button>
                </div>
                <div class="vol"><span>🔊</span><input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1" /></div>
            </div>
        </main>
    </div>

    <audio id="remoteAudio" autoplay></audio>
    <script type="module" src="main.js"></script>
</body>
</html>
